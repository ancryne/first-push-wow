<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator">
    <input type="text" id="resultField" placeholder="0">
    <div>
      <button class="special-keys">AC</button>
      <button class="special-keys">C</button>
      <button class="operators">%</button>
      <button class="operators">/</button>
    </div>
    <div>
      <button>7</button>
      <button>6</button>
      <button>5</button>
      <button class="operators">*</button>
    </div>
    <div>
      <button>4</button>
      <button>3</button>
      <button>2</button>
      <button class="operators">-</button>
    </div>
    <div>
      <button>1</button>
      <button>8</button>
      <button>9</button>
      <button class="operators">+</button>
    </div>
    <div>
      <button>.</button>
      <button>0</button>
      <button>=</button>
      <button class="operators">/</button>
    </div>
  </div>

  <p class="footer-text">Built with ❤️ by <span>Ancryne</span> </p>
  <script src="index.js"></script>
</body>
</html>
